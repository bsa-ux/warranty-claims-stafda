<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#2B221C">
<title>Tessford Warranty Desk</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" sizes="192x192" href="assets/icon-192.png">
<style>
/* ========================================================================
   RIDGELINE ELECTRICAL — WARRANTY CLAIMS PORTAL
   Material Design inspired — elevation, depth, proper type scale
   ======================================================================== */

:root {
  --primary: #2563A8;
  --primary-dark: #1A4B80;
  --primary-light: #EBF2FA;
  --primary-surface: #F5F8FC;
  --on-primary: #ffffff;
  --surface: #ffffff;
  --surface-dim: #F5F3F0;
  --surface-container: #FAFAF8;
  --background: #F0EDEA;
  --outline: #C8C4BF;
  --outline-variant: #E5E2DE;
  --on-surface: #1A1A1A;
  --on-surface-variant: #4A4641;
  --on-surface-muted: #7A756F;
  --error: #C0392B;
  --error-bg: #FDF0EF;
  --success: #1E8449;
  --success-bg: #E8F6ED;
  --warning: #D35400;
  --warning-bg: #FDF2E9;
  --info: #2563A8;
  --info-bg: #EBF2FA;
  --purple: #7D3C98;
  --purple-bg: #F4ECF7;
  --font: -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --mono: "SF Mono", "Cascadia Code", "Roboto Mono", "Consolas", monospace;
  --shadow-1: 0 1px 3px rgba(0,0,0,0.06), 0 1px 2px rgba(0,0,0,0.04);
  --shadow-2: 0 2px 8px rgba(0,0,0,0.08), 0 1px 3px rgba(0,0,0,0.04);
  --shadow-3: 0 4px 16px rgba(0,0,0,0.06), 0 2px 6px rgba(0,0,0,0.04);
  --radius-sm: 8px;
  --radius-md: 10px;
  --radius-lg: 14px;
  --radius-xl: 20px;
  --header-height: 56px;
}

* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { height: 100%; }
body {
  font-family: var(--font);
  font-size: 14px;
  line-height: 1.5;
  color: var(--on-surface);
  background: var(--background);
  -webkit-font-smoothing: antialiased;
  overflow: hidden;
}

/* ===== LOGIN SCREEN ===== */
#loginScreen {
  display: flex;
  flex-direction: column;
  height: 100%;
  background: var(--background);
}
.login-hero {
  background: linear-gradient(145deg, #1A4B80 0%, #2563A8 60%, #3B7EC9 100%);
  color: var(--on-primary);
  padding: 52px 24px 40px;
  text-align: center;
  position: relative;
}
.login-hero::after {
  content: '';
  position: absolute;
  bottom: -1px;
  left: 0;
  right: 0;
  height: 24px;
  background: var(--background);
  border-radius: 24px 24px 0 0;
}
.login-hero .logo-icon {
  width: 56px;
  height: 56px;
  background: rgba(255,255,255,0.12);
  border: 1px solid rgba(255,255,255,0.18);
  border-radius: 14px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  margin-bottom: 16px;
  backdrop-filter: blur(8px);
}
.login-hero .logo-icon svg { width: 30px; height: 30px; }
.login-hero h1 {
  font-size: 23px;
  font-weight: 600;
  letter-spacing: -0.02em;
  margin-bottom: 4px;
}
.login-hero .tagline {
  font-size: 13px;
  color: rgba(255,255,255,0.65);
  font-weight: 400;
  letter-spacing: 0.01em;
}
.login-body {
  flex: 1;
  padding: 28px 20px 12px;
  overflow-y: auto;
  display: flex;
  flex-direction: column;
  align-items: center;
}
.login-form {
  background: var(--surface);
  border-radius: var(--radius-md);
  box-shadow: var(--shadow-2);
  padding: 28px 24px;
  width: 100%;
  max-width: 360px;
  border: 1px solid var(--outline-variant);
}
.login-form .lf-title {
  font-size: 16px;
  font-weight: 600;
  color: var(--on-surface);
  margin-bottom: 24px;
  text-align: center;
  letter-spacing: -0.01em;
}
.login-form .lf-group {
  margin-bottom: 18px;
}
.login-form .lf-group label {
  display: block;
  font-size: 13px;
  font-weight: 500;
  color: var(--on-surface-variant);
  margin-bottom: 6px;
  text-transform: none;
  letter-spacing: 0;
}
.login-form .lf-group select {
  width: 100%;
  padding: 11px 14px;
  font-size: 14px;
  border: 1px solid var(--outline);
  border-radius: var(--radius-sm);
  background: var(--surface);
  color: var(--on-surface);
  cursor: pointer;
  transition: border-color 0.2s;
  font-family: var(--font);
}
.login-form .lf-group select:focus {
  outline: none;
  border-color: var(--primary);
  box-shadow: 0 0 0 3px rgba(37,99,168,0.08);
}
.login-form .lf-account-info {
  background: var(--primary-light);
  border-radius: var(--radius-sm);
  padding: 12px 14px;
  margin-top: 12px;
  font-size: 12px;
  color: var(--on-surface-variant);
  line-height: 1.5;
  display: none;
  border-left: 3px solid var(--primary);
}
.login-form .lf-account-info.visible { display: block; }
.login-form .lf-btn {
  width: 100%;
  padding: 12px;
  font-size: 14px;
  font-weight: 600;
  color: var(--on-primary);
  background: var(--primary);
  border: none;
  border-radius: var(--radius-sm);
  cursor: pointer;
  margin-top: 12px;
  transition: background 0.15s, transform 0.1s;
  letter-spacing: 0.01em;
}
.login-form .lf-btn:active { background: var(--primary-dark); transform: scale(0.98); }
.login-form .lf-btn:disabled { opacity: 0.4; cursor: not-allowed; }
.login-footer {
  padding: 16px 20px;
  text-align: center;
  font-size: 11px;
  color: var(--on-surface-muted);
}

/* ===== APP SHELL ===== */
#appShell {
  display: none;
  flex-direction: column;
  height: 100%;
  background: var(--background);
}
.app-header {
  background: var(--surface);
  color: var(--on-surface);
  padding: 0 20px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  min-height: var(--header-height);
  flex-shrink: 0;
  border-bottom: 1px solid var(--outline-variant);
  z-index: 10;
}
.app-header .ah-left {
  display: flex;
  flex-direction: column;
  gap: 1px;
}
.app-header .ah-brand {
  font-size: 15px;
  font-weight: 700;
  letter-spacing: -0.02em;
  color: var(--primary-dark);
}
.app-header .ah-user {
  font-size: 12px;
  color: var(--on-surface-muted);
}
.app-header .ah-signout {
  font-size: 12px;
  color: var(--on-surface-variant);
  background: var(--surface-dim);
  border: 1px solid var(--outline-variant);
  padding: 6px 16px;
  cursor: pointer;
  border-radius: var(--radius-sm);
  font-weight: 500;
  transition: all 0.15s;
}
.app-header .ah-signout:active { background: var(--outline-variant); }

/* TOP TABS (manufacturer) */
.tab-bar-top {
  background: var(--surface);
  display: flex;
  flex-shrink: 0;
  padding: 0 12px;
  border-bottom: 1px solid var(--outline-variant);
  z-index: 9;
}
.tab-bar-top button {
  flex: 1;
  background: none;
  border: none;
  color: var(--on-surface-muted);
  font-size: 13px;
  font-weight: 500;
  padding: 12px 4px;
  cursor: pointer;
  border-bottom: 2px solid transparent;
  transition: color 0.2s;
  margin-bottom: -1px;
}
.tab-bar-top button.active {
  color: var(--primary);
  border-bottom-color: var(--primary);
  font-weight: 600;
}

/* BOTTOM NAV (distributor) */
.nav-bottom {
  background: var(--surface);
  border-top: 1px solid var(--outline-variant);
  display: flex;
  flex-shrink: 0;
  padding: 4px 0 0;
  padding-bottom: env(safe-area-inset-bottom, 0);
  box-shadow: 0 -1px 4px rgba(0,0,0,0.06);
  z-index: 10;
}
.nav-bottom button {
  flex: 1;
  background: none;
  border: none;
  color: var(--on-surface-muted);
  font-size: 11px;
  font-weight: 500;
  padding: 6px 4px 8px;
  cursor: pointer;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 2px;
  transition: color 0.2s;
  -webkit-tap-highlight-color: transparent;
}
.nav-bottom button svg {
  width: 24px;
  height: 24px;
  fill: none;
  stroke: currentColor;
  stroke-width: 2;
  stroke-linecap: round;
  stroke-linejoin: round;
}
.nav-bottom button.active {
  color: var(--primary);
}

/* MAIN CONTENT */
#mainContent {
  flex: 1;
  overflow-y: auto;
  -webkit-overflow-scrolling: touch;
}

/* SECTION LABEL — enterprise header bar */
.section-label {
  font-size: 12px;
  font-weight: 600;
  color: var(--on-surface-muted);
  padding: 18px 20px 8px;
  display: flex;
  align-items: center;
  gap: 0;
  text-transform: uppercase;
  letter-spacing: 0.05em;
}
.section-label::before {
  display: none;
}

/* ===== STAT TILES ===== */
.stat-row {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 10px;
  padding: 12px 20px 16px;
}
.stat-tile {
  background: var(--surface);
  border-radius: var(--radius-md);
  border: 1px solid var(--outline-variant);
  padding: 16px 18px;
  position: relative;
  overflow: hidden;
}
.stat-tile .st-value {
  font-size: 28px;
  font-weight: 700;
  color: var(--on-surface);
  letter-spacing: -0.02em;
  line-height: 1.1;
}
.stat-tile .st-label {
  font-size: 11px;
  color: var(--on-surface-muted);
  margin-top: 4px;
  font-weight: 500;
  text-transform: none;
  letter-spacing: 0;
}
.stat-tile .st-accent {
  position: absolute;
  bottom: 0;
  left: 18px;
  width: 32px;
  height: 3px;
  border-radius: 3px 3px 0 0;
}

/* ===== TABLE LIST ===== */
.list-container {
  background: var(--surface);
  border-radius: var(--radius-md);
  border: 1px solid var(--outline-variant);
  margin: 0 20px 12px;
  overflow: hidden;
}
.list-container .list-header {
  display: flex;
  background: var(--surface-dim);
  color: var(--on-surface-muted);
  padding: 9px 16px;
  font-size: 11px;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.04em;
  gap: 10px;
  border-bottom: 1px solid var(--outline-variant);
}
.list-container .list-header .lh-main { flex: 1; }
.list-container .list-header .lh-status { width: 80px; text-align: right; }
.list-row {
  display: flex;
  align-items: flex-start;
  padding: 12px 16px;
  border-bottom: 1px solid var(--outline-variant);
  cursor: pointer;
  -webkit-tap-highlight-color: transparent;
  gap: 10px;
  transition: background 0.1s;
}
.list-row:last-child { border-bottom: none; }
.list-row:active { background: var(--surface-dim); }
.list-row:hover { background: var(--primary-light); }
.list-row .lr-main { flex: 1; min-width: 0; }
.list-row .lr-id {
  font-family: var(--mono);
  font-size: 12px;
  font-weight: 600;
  color: var(--primary);
}
.list-row .lr-product {
  font-size: 13px;
  color: var(--on-surface);
  margin-top: 2px;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  font-weight: 500;
}
.list-row .lr-date {
  font-size: 11px;
  color: var(--on-surface-muted);
  margin-top: 3px;
}
.list-row .lr-right {
  text-align: right;
  flex-shrink: 0;
  padding-top: 2px;
}

/* STATUS + SEVERITY */
.status-chip {
  display: inline-block;
  font-size: 10px;
  font-weight: 700;
  padding: 3px 8px;
  border-radius: 3px;
  letter-spacing: 0.04em;
  text-transform: uppercase;
}
.status-pending { background: var(--warning-bg); color: var(--warning); }
.status-under_review { background: var(--info-bg); color: var(--info); }
.status-sample_requested { background: var(--purple-bg); color: var(--purple); }
.status-info_requested { background: var(--warning-bg); color: var(--warning); }
.status-approved { background: var(--success-bg); color: var(--success); }
.status-rejected { background: var(--error-bg); color: var(--error); }

.severity-text {
  font-size: 11px;
  color: var(--on-surface-muted);
  margin-top: 4px;
}
.sev-critical { color: var(--error); font-weight: 600; }
.sev-high { color: var(--warning); font-weight: 500; }

/* CERT BADGES */
.cert-badges {
  display: flex;
  flex-wrap: wrap;
  gap: 4px;
  margin-top: 6px;
}
.cert-badge {
  font-size: 10px;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.03em;
  padding: 2px 7px;
  border-radius: 4px;
  color: var(--primary);
  background: var(--primary-light);
}

/* FILTER CHIPS — tab-style */
.filter-bar {
  display: flex;
  gap: 0;
  padding: 0 20px;
  overflow-x: auto;
  -webkit-overflow-scrolling: touch;
  border-bottom: 1px solid var(--outline-variant);
  background: var(--surface);
}
.filter-bar::-webkit-scrollbar { display: none; }
.chip {
  font-size: 13px;
  font-weight: 500;
  padding: 10px 16px;
  border: none;
  background: transparent;
  color: var(--on-surface-muted);
  border-radius: 0;
  border-bottom: 2px solid transparent;
  margin-bottom: -1px;
  cursor: pointer;
  white-space: nowrap;
  flex-shrink: 0;
  transition: all 0.15s;
}
.chip.active {
  background: transparent;
  color: var(--primary);
  border-bottom-color: var(--primary);
  font-weight: 600;
}

/* ===== DETAIL VIEW ===== */
.detail-back {
  display: flex;
  align-items: center;
  gap: 6px;
  font-size: 14px;
  font-weight: 500;
  color: var(--primary);
  background: none;
  border: none;
  padding: 14px 20px;
  cursor: pointer;
}
.detail-card {
  background: var(--surface);
  border-radius: var(--radius-md);
  border: 1px solid var(--outline-variant);
  margin: 0 20px 12px;
  overflow: hidden;
}
.detail-card-header {
  font-size: 12px;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.05em;
  color: var(--on-surface-muted);
  background: var(--surface-dim);
  padding: 10px 16px;
  border-bottom: 1px solid var(--outline-variant);
}
.detail-card-body {
  padding: 12px 16px 14px;
}
.detail-field {
  display: flex;
  justify-content: space-between;
  align-items: baseline;
  padding: 8px 0;
  font-size: 13px;
  border-bottom: 1px solid var(--outline-variant);
}
.detail-field:last-child { border-bottom: none; }
.detail-field .df-label {
  color: var(--on-surface-muted);
  font-weight: 500;
  font-size: 13px;
  min-width: 110px;
  flex-shrink: 0;
}
.detail-field .df-value {
  color: var(--on-surface);
  font-weight: 500;
  text-align: right;
  padding-left: 16px;
  word-break: break-word;
}
.detail-desc {
  font-size: 13px;
  color: var(--on-surface);
  line-height: 1.6;
  padding: 8px 16px 14px;
  background: var(--surface-dim);
  border-top: 1px solid var(--outline-variant);
}

/* TIMELINE */
.timeline-card {
  background: var(--surface);
  border-radius: var(--radius-md);
  border: 1px solid var(--outline-variant);
  margin: 0 20px 12px;
  overflow: hidden;
}
.timeline-card .tc-header {
  font-size: 12px;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.06em;
  color: var(--on-surface-muted);
  padding: 14px 16px 8px;
}
.tl-entry {
  display: flex;
  gap: 12px;
  padding: 0 16px 14px;
  position: relative;
}
.tl-entry:not(:last-child)::after {
  content: '';
  position: absolute;
  left: 21px;
  top: 22px;
  bottom: 0;
  width: 2px;
  background: var(--outline-variant);
}
.tl-dot {
  width: 10px;
  height: 10px;
  border-radius: 50%;
  background: var(--outline);
  margin-top: 5px;
  flex-shrink: 0;
  border: 2px solid var(--surface);
  box-shadow: 0 0 0 2px var(--outline);
}
.tl-entry:first-child .tl-dot {
  background: var(--primary);
  box-shadow: 0 0 0 2px var(--primary);
}
.tl-content { flex: 1; min-width: 0; }
.tl-date {
  font-size: 11px;
  color: var(--on-surface-muted);
  font-family: var(--mono);
  font-weight: 500;
}
.tl-event {
  font-size: 13px;
  color: var(--on-surface);
  margin-top: 2px;
  line-height: 1.4;
}
.tl-by {
  font-size: 11px;
  color: var(--on-surface-muted);
  margin-top: 1px;
}

/* ACTION BUTTONS — enterprise toolbar */
.action-bar {
  display: flex;
  gap: 8px;
  padding: 12px 20px 16px;
  flex-wrap: wrap;
}
.btn {
  font-size: 13px;
  font-weight: 500;
  padding: 8px 18px;
  border: 1px solid var(--outline-variant);
  background: var(--surface);
  color: var(--on-surface);
  border-radius: var(--radius-sm);
  cursor: pointer;
  -webkit-tap-highlight-color: transparent;
  transition: all 0.15s;
}
.btn:active { transform: scale(0.97); background: var(--surface-dim); }
.btn-primary {
  background: var(--primary);
  color: var(--on-primary);
  border-color: var(--primary);
  font-weight: 600;
}
.btn-primary:active { background: var(--primary-dark); }
.btn-danger { color: var(--error); border-color: currentColor; background: var(--error-bg); }
.btn-success { color: var(--success); border-color: currentColor; background: var(--success-bg); }
.btn-outlined {
  background: var(--surface);
  border: 1px solid var(--outline-variant);
}

/* ===== SEARCH ===== */
.search-box {
  padding: 16px 20px;
}
.search-input {
  width: 100%;
  padding: 12px 16px;
  font-size: 14px;
  border: 1px solid var(--outline);
  border-radius: var(--radius-xl);
  background: var(--surface);
  color: var(--on-surface);
  font-family: var(--font);
  transition: border-color 0.2s, box-shadow 0.2s;
}
.search-input:focus {
  outline: none;
  border-color: var(--primary);
  box-shadow: 0 0 0 3px rgba(37,99,168,0.12);
}
.search-input::placeholder { color: var(--on-surface-muted); }

/* PRODUCT CARD */
.product-card {
  background: var(--surface);
  border-radius: var(--radius-md);
  border: 1px solid var(--outline-variant);
  margin: 0 20px 10px;
  overflow: hidden;
}
.product-card .pc-header {
  padding: 14px 16px 10px;
}
.product-card .pc-name {
  font-size: 15px;
  font-weight: 500;
  color: var(--on-surface);
}
.product-card .pc-part {
  font-size: 12px;
  font-family: var(--mono);
  color: var(--on-surface-variant);
  margin-top: 2px;
}
.product-card .pc-specs {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 0;
  padding: 0 16px;
}
.product-card .pc-spec-item {
  display: flex;
  justify-content: space-between;
  padding: 6px 0;
  border-bottom: 1px solid var(--outline-variant);
  font-size: 13px;
}
.product-card .pc-spec-item:nth-child(odd) { padding-right: 12px; }
.product-card .pc-spec-item:nth-child(even) { padding-left: 12px; }
.product-card .ps-label { color: var(--on-surface-variant); font-weight: 500; }
.product-card .ps-value { color: var(--on-surface); font-weight: 500; }
.product-card .pc-warranty {
  margin: 8px 16px 0;
  padding: 10px 0 14px;
  border-top: 1px solid var(--outline-variant);
  font-size: 12px;
  color: var(--on-surface-variant);
  line-height: 1.5;
}

/* ===== FORM ===== */
.form-section {
  padding: 0 20px;
  margin-bottom: 12px;
}
.form-card {
  background: var(--surface);
  border-radius: var(--radius-md);
  border: 1px solid var(--outline-variant);
  padding: 16px;
  margin-bottom: 12px;
}
.form-group {
  margin-bottom: 16px;
}
.form-group:last-child { margin-bottom: 0; }
.form-group label {
  display: block;
  font-size: 12px;
  font-weight: 600;
  color: var(--on-surface-variant);
  margin-bottom: 6px;
}
.form-group select,
.form-group input[type="number"],
.form-group input[type="text"],
.form-group textarea {
  width: 100%;
  padding: 12px 14px;
  font-size: 14px;
  border: 1px solid var(--outline);
  border-radius: var(--radius-sm);
  background: var(--surface);
  color: var(--on-surface);
  font-family: var(--font);
  transition: border-color 0.2s, box-shadow 0.2s;
}
.form-group select:focus,
.form-group input:focus,
.form-group textarea:focus {
  outline: none;
  border-color: var(--primary);
  box-shadow: 0 0 0 3px rgba(37,99,168,0.12);
}
.form-group textarea {
  min-height: 90px;
  resize: vertical;
}
.form-row {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 12px;
}

/* WARRANTY CARD */
.warranty-card {
  border-radius: var(--radius-md);
  padding: 14px 16px;
  margin: 0 20px 14px;
  border: 1px solid transparent;
}
.warranty-card.active {
  background: var(--success-bg);
  border-left: 4px solid var(--success);
}
.warranty-card.expired {
  background: var(--error-bg);
  border-left: 4px solid var(--error);
}
.warranty-card .wc-status {
  font-size: 13px;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.04em;
}
.warranty-card.active .wc-status { color: var(--success); }
.warranty-card.expired .wc-status { color: var(--error); }
.warranty-card .wc-detail {
  font-size: 12px;
  color: var(--on-surface-variant);
  margin-top: 4px;
}

/* PHOTO UPLOAD */
.photo-upload {
  border: 2px dashed var(--outline);
  border-radius: var(--radius-md);
  padding: 24px;
  text-align: center;
  color: var(--on-surface-muted);
  font-size: 13px;
  cursor: pointer;
  margin: 0 20px 14px;
  background: var(--surface-container);
  transition: border-color 0.2s;
}
.photo-upload svg { margin-bottom: 6px; }
.photo-upload:active { border-color: var(--primary); }

/* SUCCESS */
.success-msg {
  text-align: center;
  padding: 48px 28px;
}
.success-msg .sm-icon {
  width: 64px;
  height: 64px;
  background: var(--success-bg);
  border-radius: 50%;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  margin-bottom: 16px;
}
.success-msg .sm-icon svg { width: 32px; height: 32px; color: var(--success); }
.success-msg h2 {
  font-size: 18px;
  font-weight: 500;
  margin-bottom: 8px;
}
.success-msg .sm-id {
  font-family: var(--mono);
  font-size: 20px;
  font-weight: 600;
  color: var(--primary);
  margin-bottom: 12px;
}
.success-msg p {
  font-size: 13px;
  color: var(--on-surface-variant);
  line-height: 1.5;
}

/* ===== ANALYTICS ===== */
.analytics-card {
  background: var(--surface);
  border-radius: var(--radius-md);
  border: 1px solid var(--outline-variant);
  margin: 0 20px 12px;
  padding: 18px;
}
.analytics-card h3 {
  font-size: 14px;
  font-weight: 600;
  text-transform: none;
  letter-spacing: -0.01em;
  color: var(--on-surface);
  margin-bottom: 2px;
}
.analytics-card .chart-subtitle {
  font-size: 12px;
  color: var(--on-surface-muted);
  margin-bottom: 14px;
  line-height: 1.4;
}
.bar-row {
  display: flex;
  align-items: center;
  margin-bottom: 8px;
  font-size: 12px;
}
.bar-row:last-child { margin-bottom: 0; }
.bar-label {
  width: 110px;
  flex-shrink: 0;
  color: var(--on-surface-variant);
  font-weight: 500;
  text-overflow: ellipsis;
  overflow: hidden;
  white-space: nowrap;
}
.bar-track {
  flex: 1;
  height: 18px;
  background: var(--surface-dim);
  border-radius: 9px;
  overflow: hidden;
  margin: 0 10px;
}
.bar-fill {
  height: 100%;
  border-radius: 9px;
  transition: width 0.3s;
}
.bar-count {
  width: 24px;
  text-align: right;
  font-family: var(--mono);
  font-weight: 600;
  font-size: 13px;
  color: var(--on-surface);
}
.metric-row {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 10px;
  padding: 0 20px;
  margin-bottom: 12px;
}
.metric-card {
  background: var(--surface);
  border-radius: var(--radius-md);
  border: 1px solid var(--outline-variant);
  padding: 16px;
  position: relative;
  overflow: hidden;
}
.metric-card .mc-icon {
  width: 32px;
  height: 32px;
  border-radius: 8px;
  display: flex;
  align-items: center;
  justify-content: center;
  margin-bottom: 8px;
}
.metric-card .mc-icon svg { width: 18px; height: 18px; }
.metric-card .mc-value {
  font-size: 24px;
  font-weight: 700;
  color: var(--on-surface);
  letter-spacing: -0.02em;
}
.metric-card .mc-label {
  font-size: 12px;
  color: var(--on-surface-muted);
  margin-top: 2px;
}

/* SLA INDICATOR */
.sla-pill {
  display: inline-block;
  font-size: 10px;
  font-weight: 600;
  letter-spacing: 0.02em;
  padding: 2px 7px;
  border-radius: 10px;
  margin-top: 3px;
}
.sla-ok { background: var(--success-bg); color: var(--success); }
.sla-warn { background: #FFF8E1; color: #F57F17; }
.sla-breach { background: var(--error-bg); color: var(--error); }

/* TREND SPARKLINE */
.sparkline-wrap {
  padding: 4px 0 0;
}
.sparkline-wrap svg { width: 100%; display: block; }
.spark-months {
  display: flex;
  justify-content: space-between;
  font-size: 10px;
  color: var(--on-surface-muted);
  padding: 4px 2px 0;
}

/* LOT RISK TABLE */
.lot-risk-row {
  display: flex;
  align-items: center;
  padding: 10px 0;
  border-bottom: 1px solid var(--outline-variant);
  font-size: 13px;
}
.lot-risk-row:last-child { border-bottom: none; }
.lot-risk-left { flex: 1; min-width: 0; }
.lot-risk-lot {
  font-family: var(--mono);
  font-size: 12px;
  font-weight: 600;
  color: var(--on-surface);
}
.lot-risk-product {
  font-size: 11px;
  color: var(--on-surface-muted);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.lot-risk-right {
  display: flex;
  align-items: center;
  gap: 10px;
  flex-shrink: 0;
}
.lot-risk-count {
  font-family: var(--mono);
  font-weight: 600;
  font-size: 14px;
}
.risk-level {
  font-size: 10px;
  font-weight: 600;
  padding: 2px 8px;
  border-radius: 10px;
  letter-spacing: 0.04em;
}
.risk-elevated { background: #FFF3E0; color: #E65100; }
.risk-normal { background: var(--surface-dim); color: var(--on-surface-muted); }

/* DONUT CHART */
.donut-chart-wrap {
  display: flex;
  align-items: center;
  gap: 16px;
}
.donut-legend {
  flex: 1;
  min-width: 0;
}
.donut-legend-item {
  display: flex;
  align-items: center;
  font-size: 12px;
  margin-bottom: 6px;
  color: var(--on-surface-variant);
}
.donut-legend-item:last-child { margin-bottom: 0; }
.donut-dot {
  width: 10px;
  height: 10px;
  border-radius: 50%;
  margin-right: 8px;
  flex-shrink: 0;
}
.donut-legend-count {
  margin-left: auto;
  font-family: var(--mono);
  font-weight: 600;
  font-size: 13px;
  color: var(--on-surface);
}

/* WARRANTY LIFECYCLE STATUSES */
.wl-active { background: var(--success-bg); color: var(--success); }
.wl-expiring_soon { background: #FFF8E1; color: #F57F17; }
.wl-expired { background: var(--error-bg); color: var(--error); }
.wl-voided { background: #FAFAFA; color: #616161; text-decoration: line-through; }

/* WARRANTY REGISTRATION LIST */
.reg-card {
  background: var(--surface);
  border-radius: var(--radius-md);
  border: 1px solid var(--outline-variant);
  margin: 0 20px 10px;
  padding: 14px 16px;
  cursor: pointer;
  transition: border-color 0.15s;
}
.reg-card:active { border-color: var(--primary); }
.reg-card .reg-header {
  display: flex; align-items: center; justify-content: space-between; margin-bottom: 6px;
}
.reg-card .reg-id {
  font-family: var(--mono); font-size: 13px; font-weight: 600; color: var(--primary);
}
.reg-card .reg-customer {
  font-size: 14px; font-weight: 500; color: var(--on-surface); margin-bottom: 2px;
}
.reg-card .reg-project {
  font-size: 12px; color: var(--on-surface-variant); white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.reg-card .reg-meta {
  display: flex; gap: 12px; margin-top: 6px; font-size: 11px; color: var(--on-surface-muted);
}

/* DATA SOURCE BADGE */
.data-source-badge {
  display: inline-flex; align-items: center; gap: 5px;
  font-size: 10px; font-weight: 600; letter-spacing: 0.03em;
  background: var(--surface-dim); color: var(--on-surface-muted);
  padding: 3px 10px; border-radius: 12px; margin-top: 4px;
}
.data-source-badge .dsb-dot {
  width: 6px; height: 6px; border-radius: 50%; background: #4CAF50;
}

/* CLAIM SOURCE CHIP */
.source-chip {
  display: inline-block; font-size: 10px; font-weight: 600;
  padding: 2px 8px; border-radius: 4px; letter-spacing: 0.03em;
}
.source-portal { background: var(--info-bg); color: var(--info); }
.source-phone { background: #FFF3E0; color: #E65100; }
.source-email { background: #F3E5F5; color: #7B1FA2; }

/* VOID MODAL */
.modal-overlay {
  position: fixed; top: 0; left: 0; right: 0; bottom: 0;
  background: rgba(0,0,0,0.4); z-index: 100;
  display: flex; align-items: flex-end; justify-content: center;
  backdrop-filter: blur(2px);
}
.modal-sheet {
  background: var(--surface); border-radius: var(--radius-xl) var(--radius-xl) 0 0;
  width: 100%; max-width: 480px; max-height: 80vh;
  padding: 24px 20px; overflow-y: auto;
  border: 1px solid var(--outline-variant);
  border-bottom: none;
  animation: slideUp 0.25s ease-out;
}
@keyframes slideUp { from { transform: translateY(100%); } to { transform: translateY(0); } }
.modal-sheet h3 {
  font-size: 18px; font-weight: 500; margin-bottom: 4px; color: var(--on-surface);
}
.modal-sheet .modal-sub {
  font-size: 13px; color: var(--on-surface-variant); margin-bottom: 16px;
}
.void-reason-option {
  display: block; width: 100%; text-align: left;
  background: var(--surface); border: 1px solid var(--outline-variant);
  border-radius: var(--radius-sm); padding: 12px 14px; margin-bottom: 8px;
  cursor: pointer; transition: border-color 0.15s;
}
.void-reason-option:hover, .void-reason-option.selected {
  border-color: var(--error); background: var(--error-bg);
}
.void-reason-option .vro-label {
  font-size: 14px; font-weight: 500; color: var(--on-surface);
}
.void-reason-option .vro-desc {
  font-size: 12px; color: var(--on-surface-variant); margin-top: 2px;
}

/* EXPIRY TRACKING */
.expiry-bucket {
  display: flex; align-items: center; padding: 10px 0;
  border-bottom: 1px solid var(--outline-variant); font-size: 13px;
}
.expiry-bucket:last-child { border-bottom: none; }
.expiry-bucket .eb-label { flex: 1; color: var(--on-surface); font-weight: 500; }
.expiry-bucket .eb-count {
  font-family: var(--mono); font-weight: 600; font-size: 16px;
  color: var(--on-surface); margin-right: 8px;
}
.expiry-bucket .eb-badge {
  font-size: 10px; font-weight: 600; padding: 2px 8px; border-radius: 10px;
}
.eb-urgent { background: var(--error-bg); color: var(--error); }
.eb-warning { background: #FFF3E0; color: #E65100; }
.eb-info { background: var(--info-bg); color: var(--info); }

/* REGISTRATION STEPPER */
.reg-stepper {
  display: flex;
  padding: 16px 20px 8px;
  gap: 4px;
}
.reg-step {
  flex: 1;
  text-align: center;
}
.reg-step .rs-bar {
  height: 3px;
  border-radius: 2px;
  background: var(--outline-variant);
  margin-bottom: 6px;
  transition: background 0.3s;
}
.reg-step.active .rs-bar { background: var(--primary); }
.reg-step.done .rs-bar { background: var(--success); }
.reg-step .rs-label {
  font-size: 10px;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.06em;
  color: var(--on-surface-muted);
  transition: color 0.2s;
}
.reg-step.active .rs-label { color: var(--primary); }
.reg-step.done .rs-label { color: var(--success); }

/* COMPLIANCE CHECKBOXES */
.compliance-section {
  padding: 0 20px 12px;
}
.compliance-card {
  background: var(--surface);
  border-radius: var(--radius-md);
  border: 1px solid var(--outline-variant);
  padding: 14px 16px;
  border-left: 3px solid var(--warning);
}
.compliance-card .cc-title {
  font-size: 12px;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.06em;
  color: var(--on-surface-muted);
  margin-bottom: 10px;
}
.compliance-check {
  display: flex;
  align-items: flex-start;
  gap: 10px;
  margin-bottom: 10px;
  cursor: pointer;
  -webkit-tap-highlight-color: transparent;
}
.compliance-check:last-child { margin-bottom: 0; }
.compliance-check input[type="checkbox"] {
  width: 18px;
  height: 18px;
  margin-top: 1px;
  flex-shrink: 0;
  accent-color: var(--primary);
}
.compliance-check .cc-text {
  font-size: 12px;
  color: var(--on-surface-variant);
  line-height: 1.5;
}

/* DOCUMENT UPLOAD SLOTS */
.doc-upload-row {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 10px;
  padding: 0 20px 12px;
}
.doc-upload-slot {
  border: 2px dashed var(--outline);
  border-radius: var(--radius-md);
  padding: 16px 10px;
  text-align: center;
  color: var(--on-surface-muted);
  font-size: 11px;
  cursor: pointer;
  background: var(--surface-container);
  transition: border-color 0.2s;
  line-height: 1.4;
}
.doc-upload-slot:active { border-color: var(--primary); }
.doc-upload-slot svg { margin-bottom: 4px; }
.doc-upload-slot .dus-label {
  font-size: 12px;
  font-weight: 600;
  color: var(--on-surface-variant);
  display: block;
  margin-bottom: 2px;
}

/* LIVE EXPIRY PREVIEW */
.expiry-preview {
  background: var(--success-bg);
  border-radius: var(--radius-md);
  padding: 14px 16px;
  margin: 0 20px 14px;
  border-left: 4px solid var(--success);
  transition: all 0.3s;
}
.expiry-preview.pending {
  background: var(--surface-dim);
  border-left-color: var(--outline);
}
.expiry-preview .ep-label {
  font-size: 11px;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.04em;
  color: var(--success);
  margin-bottom: 4px;
}
.expiry-preview.pending .ep-label { color: var(--on-surface-muted); }
.expiry-preview .ep-dates {
  font-size: 14px;
  font-weight: 500;
  color: var(--on-surface);
}
.expiry-preview .ep-duration {
  font-size: 12px;
  color: var(--on-surface-variant);
  margin-top: 2px;
}

/* ENVIRONMENT INDICATOR */
.env-chip {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  font-size: 11px;
  font-weight: 600;
  padding: 3px 10px;
  border-radius: 12px;
  letter-spacing: 0.02em;
}
.env-dry { background: #E3F2FD; color: #1565C0; }
.env-wet { background: #E0F7FA; color: #00838F; }
.env-hazardous { background: #FFF3E0; color: #E65100; }

/* EMPTY STATE */
.empty-state {
  text-align: center;
  padding: 48px 28px;
  color: var(--on-surface-muted);
  font-size: 14px;
}

/* TOAST */
.toast {
  position: fixed;
  bottom: 80px;
  left: 50%;
  transform: translateX(-50%);
  background: #323232;
  color: #fff;
  padding: 12px 24px;
  border-radius: var(--radius-sm);
  font-size: 13px;
  font-weight: 500;
  z-index: 999;
  opacity: 0;
  transition: opacity 0.3s;
  pointer-events: none;
  box-shadow: var(--shadow-3);
}
.toast.show { opacity: 1; }

/* ===== THEME TOGGLE (login footer) ===== */
.theme-toggle-wrap {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  margin-top: 8px;
  padding: 4px;
  background: var(--surface);
  border-radius: 20px;
  box-shadow: var(--shadow-1);
}
.theme-toggle-wrap .tt-label {
  font-size: 11px;
  font-weight: 600;
  padding: 5px 12px;
  border-radius: 16px;
  cursor: pointer;
  color: var(--on-surface-muted);
  transition: all 0.2s;
  user-select: none;
  -webkit-user-select: none;
}
.theme-toggle-wrap .tt-label.active {
  background: var(--primary);
  color: var(--on-primary);
  box-shadow: var(--shadow-1);
}

/* ===== CLASSIC THEME ===== */
/* Data-dense table for claims grid — Refero-inspired clean tables */
.claims-grid {
  width: 100%;
  border-collapse: collapse;
  font-size: 13px;
}
.claims-grid thead th {
  background: var(--surface);
  border: none;
  border-bottom: 2px solid var(--outline-variant);
  padding: 10px 12px;
  font-weight: 600;
  font-size: 11px;
  text-transform: uppercase;
  letter-spacing: 0.04em;
  color: var(--on-surface-muted);
  text-align: left;
  white-space: nowrap;
  position: sticky;
  top: 0;
  z-index: 2;
}
.claims-grid tbody td {
  border: none;
  border-bottom: 1px solid var(--outline-variant);
  padding: 10px 12px;
  color: var(--on-surface);
  vertical-align: middle;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  max-width: 200px;
}
.claims-grid tbody tr { cursor: pointer; transition: background 0.12s; }
.claims-grid tbody tr:hover { background: var(--primary-light); }
.claims-grid tbody tr:active { background: #D6E7F7; }
.claims-grid .cg-id {
  font-family: var(--mono);
  font-weight: 600;
  font-size: 12px;
  color: var(--primary);
}
.claims-grid .cg-status { white-space: nowrap; }
.claims-grid .cg-sev { white-space: nowrap; }
.classic-grid-wrap {
  background: var(--surface);
  border-radius: var(--radius-md);
  margin: 0 16px 12px;
  overflow-x: auto;
  -webkit-overflow-scrolling: touch;
  border: 1px solid var(--outline-variant);
}
.classic-grid-footer {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 8px 12px;
  font-size: 11px;
  color: var(--on-surface-muted);
  background: var(--surface-dim);
  border-top: 1px solid var(--outline-variant);
}

/* Registration table (classic) */
.reg-grid {
  width: 100%;
  border-collapse: collapse;
  font-size: 13px;
}
.reg-grid thead th {
  background: var(--surface);
  border: none;
  border-bottom: 2px solid var(--outline-variant);
  padding: 10px 12px;
  font-weight: 600;
  font-size: 11px;
  text-transform: uppercase;
  letter-spacing: 0.04em;
  color: var(--on-surface-muted);
  text-align: left;
  white-space: nowrap;
}
.reg-grid tbody td {
  border: none;
  border-bottom: 1px solid var(--outline-variant);
  padding: 10px 12px;
  color: var(--on-surface);
  vertical-align: middle;
}
.reg-grid tbody tr { cursor: pointer; transition: background 0.12s; }
.reg-grid tbody tr:hover { background: var(--primary-light); }

/* Classic theme overrides — body-level */

  border-radius: 4px;
  padding: 10px 12px;
}
body.theme-classic .stat-tile .st-value {
  font-size: 22px;
}

}

}
body.theme-classic .detail-card-header {

  font-size: 11px;
  padding: 6px 10px;
}
body.theme-classic .detail-field {
  padding: 5px 0;
  font-size: 12px;
}
body.theme-classic .action-bar {
  margin: 0 12px 10px;
}
body.theme-classic .timeline-card {
  margin: 0 12px 10px;
}
body.theme-classic .btn {
  padding: 7px 14px;
  font-size: 12px;
  border-radius: 4px;
}
body.theme-classic .analytics-card {
  margin: 0 12px 10px;
  padding: 12px;
  border-radius: 4px;
}
body.theme-classic .metric-row {
  padding: 0 12px;
  gap: 8px;
}
body.theme-classic .metric-card {
  border-radius: 4px;
  padding: 12px;
}
body.theme-classic .list-container {
  margin: 0 12px 10px;
  border-radius: 4px;
}
body.theme-classic .list-header {
  border-radius: 4px 4px 0 0;
}
body.theme-classic .warranty-card {
  margin: 0 12px 10px;
  border-radius: 4px;
}
body.theme-classic .reg-card {
  margin: 0 12px 8px;
  padding: 10px 12px;
  border-radius: 4px;
}
body.theme-classic .form-section {
  padding: 0 12px;
}
body.theme-classic .search-box {
  padding: 12px;
}
body.theme-classic .compliance-section {
  padding: 0 12px 10px;
}
body.theme-classic .photo-upload {
  margin: 0 12px 10px;
  border-radius: 4px;
}
body.theme-classic .doc-upload-row {
  padding: 0 12px 10px;
}
body.theme-classic .expiry-preview {
  margin: 0 12px 10px;
  border-radius: 4px;
}
body.theme-classic .product-card {
  margin: 0 12px 8px;
  border-radius: 4px;
}
body.theme-classic .detail-back {
  padding: 10px 12px;
}
</style>
</head>
<body>

<!-- LOGIN SCREEN -->
<div id="loginScreen">
  <div class="login-hero">
    <div class="logo-icon">
      <svg viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2"><path d="M13 2L3 14h9l-1 8 10-12h-9l1-8z"/></svg>
    </div>
    <h1>Tessford Lighting Co.</h1>
    <div class="tagline">Warranty Desk</div>
  </div>
  <div class="login-body">
    <div class="login-form" id="loginForm">
      <div class="lf-title">Sign in</div>
      <div class="lf-group">
        <label for="loginRole">Who’s signing in</label>
        <select id="loginRole" onchange="onLoginRoleChange()">
          <option value="">Choose one</option>
          <option value="manufacturer">Tessford warranty team</option>
          <option value="distributor">Contractor</option>
        </select>
      </div>
      <div class="lf-group" id="loginDistGroup" style="display:none">
        <label for="loginDistAccount">Your company</label>
        <select id="loginDistAccount" onchange="onLoginDistChange()">
          <option value="">Choose your company</option>
        </select>
      </div>
